    name: open NRW CKAN Action API
    description: >-
      CKAN Action API for open NRW, a consistent JSON-over-HTTP interface over a catalog of 10,579 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://open.nrw/api/3/action/.
